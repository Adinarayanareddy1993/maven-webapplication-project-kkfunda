name: CICD Pipeline final

on: 
  workflow_dispatch:

jobs:
  Build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: install the maven
        run: |
          sudo apt update
          sudo apt install maven -y

      - name: Build with maven
        run: mvn clean package

  sonarqube:
    runs-on: self-hosted
    needs: Build

    steps:
      - name: deploy in to sonar-code quality
        run: mvn sonar:sonar
  
  security-check:
    runs-on: self-hosted
    needs: sonarqube

    steps:
      - name: Install Trivy
        run: |
          wget https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.deb
          sudo dpkg -i trivy_0.69.3_Linux-64bit.deb

      - name: Trivy FS Scan
        run: |
          trivy fs --format json -o fs-report.json .

  docker-build:
    runs-on: self-hosted
    needs: security-check
    steps:
     # - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.Docker_Repository }}:${{ github.sha }} .

      - name: Run Docker Container
        run: |
          docker run -d -p 8080:8080 --name my-container ${{ secrets.Docker_Repository }}:${{ github.sha }}

      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin  

      - name: Push images to Docker Hub
        run: |
          docker push ${{ secrets.Docker_Repository }}:${{ github.sha }}
        # docker push ${{ secrets.Docker_Repository }}:latest
        
  deploy-eks:
    runs-on: self-hosted
    needs: docker-build
    steps:
      #- uses: actions/checkout@v4

    #   - name: Configure kubeconfig
    #     run: |
    #       aws eks update-kubeconfig \
    #         --name ${{ secrets.EKS_CLUSTER_NAME }} \
    #         --region ${{ secrets.AWS_REGION }}

      - name: Update Deployment Image
        run: |
          kubectl set image deployment/javawebappdep \
            javawebapp=${{ secrets.Docker_Repository }}:${{ github.sha }}


      - name: Verify rollout
        run: kubectl rollout status deployment/javawebappdep     

          
          
          