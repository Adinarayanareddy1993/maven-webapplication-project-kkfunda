name: CICD Pipeline 2

on: 
  workflow_dispatch:

jobs:
  Build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: install the maven
        run: |
          sudo apt update
          sudo apt install maven -y

      - name: Build with maven
        run: mvn clean package

  sonarqube:
    runs-on: self-hosted
    needs: Build

    steps:
      - name: deploy in to sonar-code quality
        run: mvn sonar:sonar
  
  security-check:
    runs-on: self-hosted
    needs: sonarqube

    steps:
      - name: Install Trivy
        run: |
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.50.1_Linux-64bit.deb
          sudo dpkg -i trivy_0.50.1_Linux-64bit.deb

      - name: Trivy FS Scan
        run: |
          trivy fs --format json -o fs-report.json .
          
          